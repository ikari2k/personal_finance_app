{% extends "base.html" %}
{% block title %}Accounts — Finance Tracker{% endblock %}
{% block content %}
  <h1>Accounts</h1>
  {% include "accounts/_table.html" %}
  <button hx-get="/accounts/new" hx-target="#account-dialog-content" hx-swap="innerHTML">
    Add account
  </button>

  <dialog id="account-dialog" hx-on:close-dialog="this.close()"
          hx-on:click="if (event.target === this) this.close()">
    <article>
      <header>
        <button aria-label="Close" rel="prev"
                onclick="document.getElementById('account-dialog').close()"></button>
        <strong>Account</strong>
      </header>
      <div id="account-dialog-content"
           hx-on::after-swap="if (this.firstElementChild) { const d = this.closest('dialog'); if (!d.open) d.showModal(); }"></div>
    </article>
  </dialog>
{% endblock %}
