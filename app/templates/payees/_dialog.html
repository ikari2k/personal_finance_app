<dialog id="payee-dialog" hx-on:close-dialog="this.close()"
        hx-on:click="if (event.target === this) this.close()">
  <article>
    <header>
      <button aria-label="Close" rel="prev"
              onclick="document.getElementById('payee-dialog').close()"></button>
      <strong>Payees</strong>
    </header>
    <div id="payee-dialog-content"
         hx-on::after-swap="if (this.firstElementChild) { const d = this.closest('dialog'); if (!d.open) d.showModal(); }"></div>
  </article>
</dialog>
