{% from "_payee_logo.html" import payee_logo %}
{# The payee filter's matches. `base` = the toolbar's other filters, kept on pick. #}
{% for name, n in matches %}
  <button type="button" class="payee-filter-option" role="option"
          hx-get="/transactions" hx-target="#transactions-table-wrapper" hx-swap="outerHTML"
          hx-push-url="true" hx-vals='{{ dict(base, payee=name)|tojson }}'>
    <span class="payee-filter-name">{{ payee_logo(name) }}{{ name }}</span><span class="muted">{{ n }}</span>
  </button>
{% else %}
  <div class="payee-filter-empty muted">No payee matches “{{ q }}”.</div>
{% endfor %}
