{% from "_category_icons.html" import category_icon %}
<form id="category-form" hx-post="{{ action_url }}"
      hx-target="#{{ dialog_content_id }}" hx-swap="innerHTML">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Name
    <input type="text" name="name" value="{{ values.name }}" required autofocus>
  </label>
  {% if show_budget %}
    <label>Monthly budget (optional)
      <input type="text" name="budget" value="{{ values.budget }}" placeholder="e.g. 500.00">
    </label>
  {% endif %}
  <fieldset>
    <legend>Icon</legend>
    <div class="icon-grid-toolbar">
      <button type="button" class="secondary outline icon-clear-btn"
              onclick="this.closest('fieldset').querySelectorAll('input[name=icon]:checked').forEach(function (r) { r.checked = false; })">
        Clear icon
      </button>
    </div>
    <div class="icon-grid">
      {% for key in icon_keys %}
        <label class="icon-choice-wrap" title="{{ icon_hints.get(key, key) }}">
          <input type="radio" name="icon" value="{{ key }}" {{ 'checked' if values.icon == key }}>
          <span class="icon-choice">{{ category_icon(key) }}</span>
        </label>
      {% endfor %}
    </div>
  </fieldset>
  <footer class="dialog-footer">
    <button type="button" class="btn-outline"
            onclick="document.getElementById('{{ dialog_id }}').close()">Cancel</button>
    <button type="submit">{{ 'Save changes' if editing else ('Add ' + kind) }}</button>
  </footer>
</form>
