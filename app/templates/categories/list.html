{% extends "base.html" %}
{% block title %}Categories — Finance Tracker{% endblock %}
{% block content %}
  <h1>Categories</h1>
  {% include "categories/_tree.html" %}

  <dialog id="category-dialog" hx-on:close-dialog="this.close()"
          hx-on:click="if (event.target === this) this.close()">
    <article>
      <header>
        <button aria-label="Close" rel="prev"
                onclick="document.getElementById('category-dialog').close()"></button>
        <strong>Category</strong>
      </header>
      <div id="category-dialog-content"
           hx-on::after-swap="if (this.firstElementChild) { const d = this.closest('dialog'); if (!d.open) d.showModal(); }"></div>
    </article>
  </dialog>

  <dialog id="subcategory-dialog" hx-on:close-dialog="this.close()"
          hx-on:click="if (event.target === this) this.close()">
    <article>
      <header>
        <button aria-label="Close" rel="prev"
                onclick="document.getElementById('subcategory-dialog').close()"></button>
        <strong>Subcategory</strong>
      </header>
      <div id="subcategory-dialog-content"
           hx-on::after-swap="if (this.firstElementChild) { const d = this.closest('dialog'); if (!d.open) d.showModal(); }"></div>
    </article>
  </dialog>
{% endblock %}
